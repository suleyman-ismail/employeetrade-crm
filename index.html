function mkRun(ok, fail){
  return new Proxy({}, { get: function(tg, k){
    if (k === 'withSuccessHandler') return function(f){ return mkRun(f, fail); };
    if (k === 'withFailureHandler') return function(f){ return mkRun(ok, f); };
    return function(){ var a = Array.prototype.slice.call(arguments); syncOn(1);
      apiCall(k, a).then(function(r){ syncOn(-1); if (ok) ok(r); }, function(e){ syncOn(-1); if (fail) fail(e); else toast(t('err') + e.message, 4500); }); };
  }});
}

var WAIT = ['Изпратена оферта', 'Изпратени кандидати'], STALE = 3;
function daysSince(d){ return d ? Math.round((Date.parse(D.today) - Date.parse(d)) / 86400000) : 0; }
function stale(){
  return D.clients.filter(function(c){ return WAIT.indexOf(c.s) > -1 && ('l' in c) && mine(c.r) && daysSince(c.l || c.i) > STALE; })
    .sort(function(a, b){ return daysSince(b.l || b.i) - daysSince(a.l || a.i); });
}
function staleSec(){
  var a = stale(); if (!a.length) return '';
  return sec(t('stale'), a.length, '<div class="lst">' + a.map(function(c){
    return '<div class="ti today"><div class="tr" data-n="' + esc(c.n) + '" onclick="openC(this.dataset.n)"><span class="dt"></span><span class="tx"><b>' + esc(c.n) + '</b>' +

  }).join('') + '</div>', '');
}
function staleLine(c){

// ---------- 🔎 Търсачка (име, град, телефон, позиция, контакт, адвокат – и на латиница) ----------
var TRL = { 'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t',
  'у':'u','ф':'f','х':'h','ц':'ts','ч':'ch','ш':'sh','щ':'sht','ъ':'a','ь':'y','ю':'yu','я':'ya','ѝ':'i','ç':'c','ş':'s','ğ':'g','ı':'i','ö':'o','ü':'u' };
function lat(x){
  var s = String(x || '').toLowerCase(), o = '';
  for (var i = 0; i < s.length; i++) { var ch = s.charAt(i); o += TRL.hasOwnProperty(ch) ? TRL[ch] : ch; }
  try { o = o.normalize('NFD').replace(/[̀-ͯ]/g, ''); } catch (e) {}
  return o.replace(/sht/g, 'st').replace(/zh/g, 'z').replace(/ch|ts|tz/g, 'c').replace(/sh/g, 's').replace(/kh/g, 'h').replace(/j/g, 'y')
    .replace(/w/g, 'v').replace(/x/g, 'ks').replace(/q/g, 'k').replace(/y([aeiou])/g, '$1').replace(/i([aou])/g, '$1').replace(/y/g, 'i')
    .replace(/[^a-z0-9]+/g, ' ').trim();
}
function srchBox(){
  return '<div class="srch"><input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="' + esc(t('q')) + '" value="' + esc(Q) + '" oninput="Q=this.value;onQ()"></div>';
}
function cmpC(x, y){
  var cx = D.closed.indexOf(x.s) > -1, cy = D.closed.indexOf(y.s) > -1;
  if (cx !== cy) return cx ? 1 : -1;
  var nx = x.nx && x.nx !== '-' ? x.nx : '9999', ny = y.nx && y.nx !== '-' ? y.nx : '9999';
  if (!x.nx !== !y.nx) return x.nx ? 1 : -1;
  return nx < ny ? -1 : nx > ny ? 1 : x.n.localeCompare(y.n);
}
function findC(q){
  var toks = lat(q).split(' ').filter(Boolean), qd = q.replace(/[^0-9]/g, ''), digits = /^[0-9\s+()\/-]+$/.test(q.trim());
  var out = [];
  D.clients.forEach(function(c){
    var sc = 0;
    if (digits) {
      var pd = String(c.p || '').replace(/[^0-9]/g, '');
      if (qd.length >= 3 && (pd.indexOf(qd) > -1 || intl(c.p).indexOf(intl(qd)) > -1)) sc = 2;
    } else if (toks.length) {
      var n = lat(c.n), hay = n + ' ' + lat(c.c) + ' ' + lat(c.m) + ' ' + lat(tv(c.m)) + ' ' + lat(c.k) + ' ' + lat(c.lw), hayC = hay.replace(/[aeiou]/g, '');
      var exact = toks.every(function(x){ return hay.indexOf(x) > -1; });
      var loose = !exact && toks.every(function(x){ var k = x.replace(/[aeiou]/g, ''); return hay.indexOf(x) > -1 || (k.length >= 3 && hayC.indexOf(k) > -1); });
      if (exact) sc = (' ' + n).indexOf(' ' + toks[0]) > -1 ? 4 : n.indexOf(toks[0]) > -1 ? 3 : 2;
      else if (loose) sc = 1;
    }
    if (sc) out.push({ c: c, sc: sc });
  });
  out.sort(function(a, b){ return b.sc - a.sc || cmpC(a.c, b.c); });
  return out.map(function(x){ return x.c; });
}
function clientRow(c){
  var col = (STC[c.s] || ['#e2e8f0', '#94a3b8'])[1];
  return '<div class="lr" data-n="' + esc(c.n) + '" onclick="openC(this.dataset.n)" title="' + esc(tv(c.s)) + '"><span class="dt" style="background:' + col + '"></span>' +

function rows(a){ return '<div class="lst">' + a.map(clientRow).join('') + '</div>'; }
function results(q){

  h += '<div class="box law"><div class="lb">' + t('lawyer') + '</div>' + (c.lawyer || c.lawPhone

  // 👷 Кандидати
  var cs = c.cands || [];

  // 👤 Информация

    .filter(function(r){ return r[1]; }).map(function(r){ return '<div>' + r[0] + ' ' + esc(r[1]) + '</div>'; }).join('');
  h += fold('info', t('sInfo'), esc(c.phone || c.city),

  // 🏷️ Етап
  h += fold('stage', t('sStage'), pill(c.stage), '<div class="chips">' + D.stages.map(function(s){
    return '<button class="' + (s === c.stage ? 'on' : '') + '" data-s="' + esc(s) + '" onclick="stageC(this.dataset.s)">' + esc(tv(s)) + '</button>'; }).join('') + '</div>');
  // 🕑 История
  var hist = c.tasks.length ? c.tasks.map(function(x){
    var p = x.status === 'Планирана', ic = p ? '🔵' : x.status === 'Изпълнена' ? '✅' : '✖️';
    return '<div class="hist ' + (p ? 'pl' : 'dn') + '"><div class="when">' + ic + ' ' + fmt(x.date) + (x.time ? ' · ' + esc(x.time) : '') + ' · ' + esc(tv(x.status)) + '</div>' +
      '<div class="t">' + esc(tv(x.type)) + (x.rep ? ' <span class="s">👤 ' + esc(x.rep) + '</span>' : '') + '</div>' +
      (x.remind ? '<div class="s" style="color:#92400e">🔔 ' + esc(x.remind) + '</div>' : '') + (x.desc ? '<div class="s notes">' + esc(x.desc) + '</div>' : '') + '</div>';
  }).join('') : '<div class="s">' + t('noTasks') + '</div>';
  h += fold('hist', t('sHist') + ' (' + c.tasks.length + ')', pl.length ? pl.length + (pl.length === 1 ? t('planned1') : t('plannedN')) : '', hist);
  // 📝 Бележки
  h += fold('notes', t('sNotes'), esc((c.notes || '').split(NL)[0]),
    '<div class="notes">' + (c.notes ? esc(c.notes) : '<span class="s">' + t('noNotes') + '</span>') + '</div><div class="acts"><button onclick="editC()">' + t('edit') + '</button></div>');
  // 📎 Документи на фирмата
  var fl = c.files || [];
  var fh = c.photoErr ? '<div class="s">' + esc(c.photoErr) + '</div>' : (fl.length ? fl.map(fileRow).join('') + '<div class="s" style="margin-top:6px">' + t('fHint') + '</div>'
    : '<div class="s">' + t('noFiles') + '</div>') +
    '<div class="acts">' + upLabel(t('addFile'), '', 'doc', '') + (c.folder ? '<a href="' + esc(c.folder) + '" target="_blank">' + t('openF') + '</a>' : '') + '</div>';
  h += fold('files', t('sFiles') + ' (' + fl.length + ')', '', fh);
  // 📸 Снимки на фирмата
  var ph = c.photoErr ? '' : (c.photos.length ? photoGrid(c.photos) : '<div class="s">' + t('noPhotos') + '</div>') +
    '<div class="acts">' + upLabel(t('photo'), 'image/*', 'photo', '') + (c.folder ? '<a href="' + esc(c.folder) + '" target="_blank">' + t('openF') + '</a>' : '') + '</div>';
  h += fold('photos', t('sPhotos') + ' (' + c.photos.length + ')', '', ph);
  el('cdB').innerHTML = h;
}
function photoGrid(a){ return '<div class="ph">' + a.map(function(p){ return '<a data-id="' + esc(p.id) + '" onclick="viewPhoto(this.dataset.id)">' + (p.thumb ? '<img src="' + p.thumb + '" alt="">' : '📷') + '</a>'; }).join('') + '</div>'; }
function fileRow(f, cand){
  var isV = /^video\//.test(f.mime || '') || /\.(mp4|mov|m4v|3gp|webm|avi|mkv)$/i.test(f.name || '');
  return '<div class="fl"><a class="fn" href="' + esc(f.url) + '" target="_blank" rel="noopener"><span class="fi">' + fIcon(f) + '</span><span class="fx"><b>' + esc(f.name) + '</b><small>' +
    [fSize(f.size), f.t ? fmt(dayOf(f.t)) : ''].filter(Boolean).join(' · ') + '</small></span></a>' +
    (isV ? '' : '<button data-id="' + esc(f.id) + '" onclick="dlF(this.dataset.id)">⬇️</button>') +
    '<button data-id="' + esc(f.id) + '" data-n="' + esc(f.name) + '" data-c="' + esc(cand || '') + '" onclick="delF(this.dataset.id,this.dataset.n,this.dataset.c)">🗑️</button></div>';
}
function dayOf(x){ var d = new Date(x); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function fSize(b){ b = Number(b) || 0; return b >= 1048576 ? (b / 1048576).toFixed(1).replace('.', ',') + ' MB' : b ? Math.max(1, Math.round(b / 1024)) + ' KB' : ''; }
function fIcon(f){
  var n = String(f.name || '').toLowerCase(), m = String(f.mime || '');
  if (/^video\//.test(m) || /\.(mp4|mov|m4v|3gp|webm|avi|mkv)$/.test(n)) return '🎬';
  if (/^image\//.test(m)) return '🖼️';
  if (/pdf/.test(m) || /\.pdf$/.test(n)) return '📄';
  if (/sheet|excel|csv/.test(m) || /\.(xlsx?|csv|ods)$/.test(n)) return '📊';
  if (/presentation|powerpoint/.test(m) || /\.(pptx?|odp|key)$/.test(n)) return '📽️';
  if (/word|document|text\//.test(m) || /\.(docx?|odt|txt|rtf|pages)$/.test(n)) return '📝';
  if (/zip|rar|7z|compressed/.test(m) || /\.(zip|rar|7z)$/.test(n)) return '🗜️';
  if (/^audio\//.test(m)) return '🎧';
  return '📎';
}

function newCand(){
  var n = prompt(t('candPrompt')); n = String(n || '').trim(); if (!n) return;

function drawCand(){

    upLabel('<span>🎬</span>' + t('video').replace('🎬 ', ''), 'video/*', 'doc', k.name) +

function candSt(s){

  google.script.run.withSuccessHandler(function(){ toast('👷 ' + n + ': ' + tv(s)); }).withFailureHandler(function(e){ err(e); openCand(n); }).setCandStatus(CUR.name, n, s);

// ---------- 📤 Качване: снимки (смалени) / документи и видеа (на части по 8 MB) ----------
var MAXMB = 500;
function upPick(inp){ var fs = Array.prototype.slice.call(inp.files || []), m = inp.getAttribute('data-m'), c = inp.getAttribute('data-c') || ''; inp.value = ''; upload(fs, m, c); }
function prog(txt, pct){ el('prog').style.display = 'block'; el('progT').textContent = txt; el('progB').style.width = Math.max(2, Math.min(100, pct || 0)) + '%'; }
function progOff(){ el('prog').style.display = 'none'; }
function upload(fs, mode, cand){
  if (!CUR) return;
  var emp = CUR.name, i = 0, nOk = 0;
  var big = fs.filter(function(f){ return f.size > MAXMB * 1048576; });
  fs = fs.filter(function(f){ return f.size > 0 && f.size <= MAXMB * 1048576; });
  if (big.length) toast(t('tooBig', { mb: MAXMB }) + big.map(function(f){ return f.name; }).join(', '), 7000);
  if (!fs.length) return;
  var total = fs.reduce(function(s, f){ return s + f.size; }, 0), doneB = 0;
  var label = function(f, b){ return t('up') + (fs.length > 1 ? ' ' + (i + 1) + '/' + fs.length : '') + ': ' + f.name + ' · ' + Math.round((doneB + b) / total * 100) + '%'; };
  var fail = function(e){ progOff(); err(e); finish(); };
  var finish = function(){
    progOff(); if (nOk) toast(t('upd', { n: nOk }));
    if (cand) { if (CAND && CAND.name === cand) openCand(cand); refreshCard(); }
    else { if (mode === 'photo') OPEN.photos = true; else OPEN.files = true; try { localStorage.setItem('crm_open', JSON.stringify(OPEN)); } catch (e) {} refreshCard(); }
  };
  var nextF = function(){
    if (i >= fs.length) { finish(); return; }
    var f = fs[i], ok = function(){ nOk++; doneB += f.size; i++; nextF(); };
    prog(label(f, 0), doneB / total * 100);
    if (mode === 'photo' && /^image\/(jpeg|png|webp|gif)$/.test(f.type)) {
      shrink2(f, function(data, thumb){ api('uploadPhoto', [emp, data, f.name, thumb, cand]).then(ok, fail); });
    } else {
      chunked(f, emp, cand, function(b){ prog(label(f, b), (doneB + b) / total * 100); }).then(ok, fail);
    }
  };
  nextF();
}
function readB64(blob){
  return new Promise(function(res, rej){ var rd = new FileReader(); rd.onload = function(){ res(String(rd.result).split(',')[1] || ''); }; rd.onerror = function(){ rej(new Error(t('readErr'))); }; rd.readAsDataURL(blob); });
}
function chunked(f, emp, cand, onP){
  return api('startUpload', [emp, cand, f.name, f.type || '', f.size]).then(function(s){
    var size = s.chunk || 8388608, pos = 0, tries = 0;
    var step = function(){
      var end = Math.min(pos + size, f.size);
      return readB64(f.slice(pos, end)).then(function(b64){ return api('uploadChunk', [s.id, pos, b64]); }).then(function(r){
        tries = 0;
        if (r.done) { onP(f.size); return r; }
        pos = r.next || end; onP(pos); return step();
      }, function(e){ if (++tries <= 3 && !/AUTH|изтече|süresi/.test(e.message)) return new Promise(function(ok){ setTimeout(ok, 1500 * tries); }).then(step); throw e; });
    };
    return step();
  });
}
function dlF(id){
  toast(t('dl'), 120000);
  google.script.run.withSuccessHandler(function(r){
    if (!r.data) { toast(t('openDrive')); window.open(r.url, '_blank'); return; }
    var m = r.data.match(/^data:([^;,]*)[^,]*;base64,([\s\S]*)$/), b = atob(m[2]), u8 = new Uint8Array(b.length);
    for (var k = 0; k < b.length; k++) u8[k] = b.charCodeAt(k);
    var url = URL.createObjectURL(new Blob([u8], { type: m[1] || r.mime })), a = document.createElement('a');
    a.href = url; a.download = r.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
    toast('✅ ' + r.name);
  }).withFailureHandler(err).getFile(id);
}
function delF(id, name, cand){
  if (!confirm(t('del', { n: name }))) return;
  if (cand) {
    google.script.run.withSuccessHandler(function(k){ if (CAND && CAND.name === cand) { CAND = k; drawCand(); } toast(t('deleted') + name); refreshCard(); }).withFailureHandler(err).trashFile(id, CUR.name, cand);
    return;
  }
  cardBusy(true);
  google.script.run.withSuccessHandler(function(c){ CUR = c; cardBusy(false); drawCard(); toast(t('deleted') + name); }).withFailureHandler(cardErr).trashFile(id, CUR.name, '');
}
function cardBusy(on){ el('cdB').style.opacity = on ? .45 : 1; el('cdB').style.pointerEvents = on ? 'none' : 'auto'; }
function cardErr(e){ cardBusy(false); err(e); }
function stageC(s){

  h += half(fld(t('fSalary'), '<input name="salary" value="' + esc(c.salary) + '">'), fld(t('fSrc').replace(/ \(.*/, ''), '<select name="src">' + opts(blank(withCur(D.sources, c.src)), c.src) + '</select>'));

  h += fld(t('fNotes'), '<textarea name="notes" rows="6">' + esc(c.notes) + '</textarea>');
  h += '<button class="save" id="sv">' + t('save') + '</button></form>';
  openSheet('✏️ ' + c.name, h);

function sendEdit(e){
  e.preventDefault();

function locC(){

  }, function(){ cardBusy(false); toast(t('geoErr'), 4500); }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 60000 });

function viewPhoto(id){
  el('pvI').removeAttribute('src'); el('pvL').textContent = t('loading'); el('pvL').style.display = 'block'; el('pv').style.display = 'flex';
  google.script.run.withSuccessHandler(function(u){ el('pvL').style.display = 'none'; el('pvI').src = u; })
    .withFailureHandler(function(e){ el('pvL').textContent = t('err') + e.message; }).getPhoto(id);
}
function closePv(){ el('pv').style.display = 'none'; el('pvI').removeAttribute('src'); }
function shrinkTo(img, m, q){
  var w = img.width, h = img.height, k = Math.min(1, m / Math.max(w, h));
  var cv = document.createElement('canvas'); cv.width = Math.round(w * k); cv.height = Math.round(h * k);
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  return cv.toDataURL('image/jpeg', q);
}
function shrink2(file, cb){
  var rd = new FileReader();
  rd.onload = function(){
    var img = new Image();
    img.onload = function(){ cb(shrinkTo(img, 2000, 0.85), shrinkTo(img, 360, 0.7)); };
    img.onerror = function(){ cb(rd.result, ''); };
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}

document.addEventListener('visibilitychange', function(){ if (!document.hidden && D && TOKEN && el('sheet').style.display !== 'block' && el('prog').style.display !== 'block') load(); });
// Нова версия → проверява се при всяко отваряне/връщане в приложението и се зарежда сама
if ('serviceWorker' in navigator) {
  var swHad = !!navigator.serviceWorker.controller, swDone = false;
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function(r){
    document.addEventListener('visibilitychange', function(){ if (!document.hidden) r.update().catch(function(){}); });
    setInterval(function(){ r.update().catch(function(){}); }, 1800000);
  }).catch(function(){});
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if (!swHad) { swHad = true; return; }
    if (swDone) return; swDone = true;
    if (el('sheet').style.display === 'block' || el('prog').style.display === 'block') { toast(t('newVerL'), 5000); return; }
    toast(t('newVer'), 3000); setTimeout(function(){ location.reload(); }, 400);
  });
}
