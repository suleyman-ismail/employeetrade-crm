function tv(x){ if (LANG !== 'tr' || !x) return x || ''; return (D && D.tr && D.tr[x]) || TRX[x] || x; }

function applyLang(){
  document.documentElement.lang = LANG;
  el('lgB').textContent = LANG === 'tr' ? 'BG' : 'TR'; el('lgL').textContent = el('lgB').textContent;
  [['t', 'tabT'], ['o', 'tabO'], ['c', 'tabC'], ['k', 'tabK'], ['r', 'tabR']].forEach(function(x){ var s = t(x[1]), i = s.indexOf(' '); el('tb_' + x[0]).innerHTML = '<i>' + s.slice(0, i) + '</i>' + esc(s.slice(i + 1)); });

  el('lgP').textContent = t('pin'); if (el('ld0')) el('ld0').textContent = t('loading');
}

// ================= API =================
var TOKEN = ls('et_token') || '';
function apiCall(fn, args, extra){
  var body = { fn: fn, args: args || [], token: TOKEN, lang: LANG };
  if (extra) for (var k in extra) body[k] = extra[k];
  return fetch(API_URL, { method: 'POST', body: JSON.stringify(body) })
    .catch(function(){ var e = new Error(t('noNet')); e.offline = true; throw e; })
    .then(function(r){ if (!r.ok) throw new Error(t('srv') + ' (' + r.status + ')'); return r.json(); })
    .then(function(j){
      if (!j.ok) { if (j.error === 'AUTH') { logout(); throw new Error(t('reLogin')); } throw new Error(j.error); }
      return j.data;
    });
}
// google.script.run.withSuccessHandler(...).withFailureHandler(...).fn(...)
function mkRun(ok, fail){
  return new Proxy({}, { get: function(tg, k){
    if (k === 'withSuccessHandler') return function(f){ return mkRun(f, fail); };
    if (k === 'withFailureHandler') return function(f){ return mkRun(ok, f); };
    return function(){ var a = Array.prototype.slice.call(arguments); syncOn(1);
      apiCall(k, a).then(function(r){ syncOn(-1); if (ok) ok(r); }, function(e){ syncOn(-1); if (fail) fail(e); else toast(t('err') + e.message, 4500); }); };
  }});
}
var google = { script: { get run(){ return mkRun(null, null); } } };
function api(fn, args){ syncOn(1); return apiCall(fn, args).then(function(r){ syncOn(-1); return r; }, function(e){ syncOn(-1); throw e; }); }

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
// value = български (както в таблицата), текст = преведен
function opts(a, sel){ return a.map(function(x){ return '<option value="' + esc(x) + '"' + (x === sel ? ' selected' : '') + '>' + esc(x ? tv(x) : '') + '</option>'; }).join(''); }
function toast(s, ms){ var e = el('toast'); e.textContent = s; e.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(function(){ e.style.display = 'none'; }, ms || 2500); }
function fmt(d){ if (!d) return '—'; var p = d.split('-'); return parseInt(p[2], 10) + ' ' + MONS[LANG][parseInt(p[1], 10) - 1]; }
function rel(d){ if (d < D.today) return 'over'; if (d === D.today) return 'today'; return ''; }
function whenTxt(d, tm){ var r = rel(d); return (r === 'over' ? t('overdue') + ' · ' : r === 'today' ? t('today') + ' · ' : '') + fmt(d) + (tm ? ' · ' + tm : ''); }
function addD(n){ var p = D.today.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n)).toISOString().slice(0, 10); }
function pill(s){ var c = STC[s] || ['#e2e8f0','#334155']; return s ? '<span class="pill" style="background:' + c[0] + ';color:' + c[1] + '">' + esc(tv(s)) + '</span>' : ''; }
function busy(on){ el('main').style.opacity = on ? .45 : 1; el('main').style.pointerEvents = on ? 'none' : 'auto'; }
function err(e){ busy(false); progOff(); toast(t('err') + (e && e.message ? e.message : e), 4500); }
function localToday(){ var n = new Date(); return n.getFullYear() + '-' + ('0' + (n.getMonth() + 1)).slice(-2) + '-' + ('0' + n.getDate()).slice(-2); }

function boot(){
  applyLang();

var WAIT = ['Изпратена оферта', 'Изпратени кандидати'], STALE = 3;
function daysSince(d){ return d ? Math.round((Date.parse(D.today) - Date.parse(d)) / 86400000) : 0; }
function stale(){
  return D.clients.filter(function(c){ return WAIT.indexOf(c.s) > -1 && ('l' in c) && mine(c.r) && daysSince(c.l || c.i) > STALE; })
    .sort(function(a, b){ return daysSince(b.l || b.i) - daysSince(a.l || a.i); });
}
function staleSec(){
  var a = stale(); if (!a.length) return '';
  return sec(t('stale'), a.length, '<div class="lst">' + a.map(function(c){
    return '<div class="ti today"><div class="tr" data-n="' + esc(c.n) + '" onclick="openC(this.dataset.n)"><span class="dt"></span><span class="tx"><b>' + esc(c.n) + '</b>' +

function staleLine(c){

// ---------- 🔎 Търсачка (име, град, телефон, позиция, контакт, адвокат – и на латиница) ----------
var TRL = { 'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t',
  'у':'u','ф':'f','х':'h','ц':'ts','ч':'ch','ш':'sh','щ':'sht','ъ':'a','ь':'y','ю':'yu','я':'ya','ѝ':'i','ç':'c','ş':'s','ğ':'g','ı':'i','ö':'o','ü':'u' };
function lat(x){
  var s = String(x || '').toLowerCase(), o = '';
  for (var i = 0; i < s.length; i++) { var ch = s.charAt(i); o += TRL.hasOwnProperty(ch) ? TRL[ch] : ch; }
  try { o = o.normalize('NFD').replace(/[̀-ͯ]/g, ''); } catch (e) {}
  return o.replace(/sht/g, 'st').replace(/zh/g, 'z').replace(/ch|ts|tz/g, 'c').replace(/sh/g, 's').replace(/kh/g, 'h').replace(/j/g, 'y')
    .replace(/w/g, 'v').replace(/x/g, 'ks').replace(/q/g, 'k').replace(/y([aeiou])/g, '$1').replace(/i([aou])/g, '$1').replace(/y/g, 'i')
    .replace(/[^a-z0-9]+/g, ' ').trim();
}
function srchBox(){
  return '<div class="srch"><input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="' + esc(t('q')) + '" value="' + esc(Q) + '" oninput="Q=this.value;onQ()"></div>';
}
function cmpC(x, y){
  var cx = D.closed.indexOf(x.s) > -1, cy = D.closed.indexOf(y.s) > -1;
  if (cx !== cy) return cx ? 1 : -1;
  var nx = x.nx && x.nx !== '-' ? x.nx : '9999', ny = y.nx && y.nx !== '-' ? y.nx : '9999';
  if (!x.nx !== !y.nx) return x.nx ? 1 : -1;
  return nx < ny ? -1 : nx > ny ? 1 : x.n.localeCompare(y.n);
}
function findC(q){
  var toks = lat(q).split(' ').filter(Boolean), qd = q.replace(/[^0-9]/g, ''), digits = /^[0-9\s+()\/-]+$/.test(q.trim());
  var out = [];
  D.clients.forEach(function(c){
    var sc = 0;
    if (digits) {
      var pd = String(c.p || '').replace(/[^0-9]/g, '');
      if (qd.length >= 3 && (pd.indexOf(qd) > -1 || intl(c.p).indexOf(intl(qd)) > -1)) sc = 2;
    } else if (toks.length) {
      var n = lat(c.n), hay = n + ' ' + lat(c.c) + ' ' + lat(c.m) + ' ' + lat(tv(c.m)) + ' ' + lat(c.k) + ' ' + lat(c.lw), hayC = hay.replace(/[aeiou]/g, '');
      var exact = toks.every(function(x){ return hay.indexOf(x) > -1; });
      var loose = !exact && toks.every(function(x){ var k = x.replace(/[aeiou]/g, ''); return hay.indexOf(x) > -1 || (k.length >= 3 && hayC.indexOf(k) > -1); });
      if (exact) sc = (' ' + n).indexOf(' ' + toks[0]) > -1 ? 4 : n.indexOf(toks[0]) > -1 ? 3 : 2;
      else if (loose) sc = 1;
    }
    if (sc) out.push({ c: c, sc: sc });
  });
  out.sort(function(a, b){ return b.sc - a.sc || cmpC(a.c, b.c); });
  return out.map(function(x){ return x.c; });
}
function clientRow(c){
  var col = (STC[c.s] || ['#e2e8f0', '#94a3b8'])[1];
  return '<div class="lr" data-lp="c" data-n="' + esc(c.n) + '" onclick="openC(this.dataset.n)" title="' + esc(tv(c.s)) + '"><span class="dt" style="background:' + col + '"></span>' +

}
function rows(a){ return '<div class="lst">' + a.map(clientRow).join('') + '</div>'; }
function results(q){

function drawReport(){
  var cs = D.clients.filter(function(c){ return mine(c.r); }), ts = D.tasks.filter(function(x){ return mine(x.rep); });
  var open = cs.filter(function(c){ return c.s && D.closed.indexOf(c.s) < 0; }), won = cs.filter(function(c){ return (D.won || []).indexOf(c.s) > -1; });
  var sumW = function(a){ return a.reduce(function(s, c){ return s + (c.w || 0); }, 0); };
  var mon = D.today.slice(0, 7), neu = cs.filter(function(c){ return c.i && c.i.slice(0, 7) === mon; });
  var k = function(l, v, col){ return '<div class="kpi"><div class="l">' + l + '</div><div class="v" style="color:' + col + '">' + v + '</div></div>'; };
  var h = '<div class="kpis">' + k(t('kAct'), open.length, '#0d2b50') + k(t('kWork'), sumW(open), '#0063b5') +
    k(t('kToday'), ts.filter(function(x){ return x.date === D.today; }).length, '#c2410c') + k(t('kLate'), ts.filter(function(x){ return x.date < D.today; }).length, '#b91c1c') +
    k(t('kNew'), neu.length, '#1d4ed8') + k(t('kWon'), won.length, '#15803d');
  var kc = (D.cands || []).filter(kMine), ka = kc.filter(function(x){ return !kOut(x.st); });
  h += k(t('kgActive'), ka.length, '#0063b5') + k(t('kgWork'), kc.filter(function(x){ return x.st === 'Работи'; }).length, '#166534') + k(t('kgDocs'), ka.filter(function(x){ return kWarn(x); }).length, '#b91c1c') + '</div>';
  var st = D.stages.slice(); cs.forEach(function(c){ if (c.s && st.indexOf(c.s) < 0) st.push(c.s); });
  var rws = st.map(function(s){ var a = cs.filter(function(c){ return c.s === s; }); return { s: s, n: a.length, w: sumW(a) }; });
  var mx = Math.max.apply(null, rws.map(function(r){ return r.n; }).concat([1]));
  h += '<h2>' + t('byStage') + '<span>' + cs.length + '</span></h2>' + rws.map(function(r){
    return '<div class="bar"><div class="r"><span>' + pill(r.s) + '</span><span><b>' + r.n + '</b>' + (r.w ? ' · 👷 ' + r.w + ' ' + t('wk') : '') + '</span></div><div class="b" style="width:' + Math.round(r.n / mx * 100) + '%"></div></div>';
  }).join('');
  el('main').innerHTML = h;
}

// ---------- 📤 Качване: снимки (смалени) / документи и видеа (на части по 8 MB) ----------
var MAXMB = 500;
function upPick(inp){ var fs = Array.prototype.slice.call(inp.files || []), m = inp.getAttribute('data-m'), c = inp.getAttribute('data-c') || ''; inp.value = ''; upload(fs, m, c); }
function prog(txt, pct){ el('prog').style.display = 'block'; el('progT').textContent = txt; el('progB').style.width = Math.max(2, Math.min(100, pct || 0)) + '%'; }
function progOff(){ el('prog').style.display = 'none'; }
function upload(fs, mode, cand){
  if (!CUR && !cand) return;
  var emp = CUR ? CUR.name : '', i = 0, nOk = 0;
  var big = fs.filter(function(f){ return f.size > MAXMB * 1048576; });
  fs = fs.filter(function(f){ return f.size > 0 && f.size <= MAXMB * 1048576; });
  if (big.length) toast(t('tooBig', { mb: MAXMB }) + big.map(function(f){ return f.name; }).join(', '), 7000);
  if (!fs.length) return;
  var total = fs.reduce(function(s, f){ return s + f.size; }, 0), doneB = 0;
  var label = function(f, b){ return t('up') + (fs.length > 1 ? ' ' + (i + 1) + '/' + fs.length : '') + ': ' + f.name + ' · ' + Math.round((doneB + b) / total * 100) + '%'; };
  var fail = function(e){ progOff(); err(e); finish(); };
  var finish = function(){
    progOff(); if (nOk) toast(t('upd', { n: nOk }));
    if (cand) { if (KC && KC.id === cand) kOpen(cand); else if (CAND && CAND.name === cand) openCand(cand); if (CUR) refreshCard(); }
    else { if (mode === 'photo') OPEN.photos = true; else OPEN.files = true; try { localStorage.setItem('et_open', JSON.stringify(OPEN)); } catch (e) {} refreshCard(); }
  };
  var nextF = function(){
    if (i >= fs.length) { finish(); return; }
    var f = fs[i], ok = function(){ nOk++; doneB += f.size; i++; nextF(); };
    prog(label(f, 0), doneB / total * 100);
    if (mode === 'photo' && /^image\/(jpeg|png|webp|gif)$/.test(f.type)) {
      shrink2(f, function(data, thumb){ api('uploadPhoto', [emp, data, f.name, thumb, cand]).then(ok, fail); });
    } else {
      chunked(f, emp, cand, function(b){ prog(label(f, b), (doneB + b) / total * 100); }).then(ok, fail);
    }
  };
  nextF();
}
function readB64(blob){
  return new Promise(function(res, rej){ var rd = new FileReader(); rd.onload = function(){ res(String(rd.result).split(',')[1] || ''); }; rd.onerror = function(){ rej(new Error(t('readErr'))); }; rd.readAsDataURL(blob); });
}
function chunked(f, emp, cand, onP){
  return api('startUpload', [emp, cand, f.name, f.type || '', f.size]).then(function(s){
    var size = s.chunk || 8388608, pos = 0, tries = 0;
    var step = function(){
      var end = Math.min(pos + size, f.size);
      return readB64(f.slice(pos, end)).then(function(b64){ return api('uploadChunk', [s.id, pos, b64]); }).then(function(r){
        tries = 0;
        if (r.done) { onP(f.size); return r; }
        pos = r.next || end; onP(pos); return step();
      }, function(e){ if (++tries <= 3 && !/AUTH|изтече|süresi/.test(e.message)) return new Promise(function(ok){ setTimeout(ok, 1500 * tries); }).then(step); throw e; });
    };
    return step();
  });

  var w = img.width, h = img.height, k = Math.min(1, m / Math.max(w, h));
  var cv = document.createElement('canvas'); cv.width = Math.round(w * k); cv.height = Math.round(h * k);
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  return cv.toDataURL('image/jpeg', q);
}
function shrink2(file, cb){
  var rd = new FileReader();
  rd.onload = function(){
    var img = new Image();
    img.onload = function(){ cb(shrinkTo(img, 2000, 0.85), shrinkTo(img, 360, 0.7)); };
    img.onerror = function(){ cb(rd.result, ''); };
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}

document.addEventListener('mousemove', lpMove); document.addEventListener('mouseup', lpEnd);
document.addEventListener('click', function(e){ if (LPFIRED) { LPFIRED = false; e.stopPropagation(); e.preventDefault(); } }, true);
document.addEventListener('contextmenu', function(e){ var tg = e.target.closest && e.target.closest('[data-lp]'); if (!tg) return; e.preventDefault(); clearTimeout(LP); LP = null; if (Date.now() - LPT > 900) lpOpen(tg); });
function lpShow(title, b){
  if (!b.length) return; LPT = Date.now(); LPA = b;
  el('lpmB').innerHTML = '<h4>' + esc(title) + '</h4>' + b.map(function(x, i){ return '<button class="' + (x[2] || '') + '" onclick="lpGo(' + i + ')">' + x[0] + '</button>'; }).join('') + '<button class="cx" onclick="lpClose()">' + t('lpClose') + '</button>';
  el('lpm').style.display = 'flex';
}
function lpClose(){ el('lpm').style.display = 'none'; }
function lpGo(i){ var a = LPA[i]; lpClose(); if (a) a[1](); }
function lpOpen(tg){
  var k = tg.getAttribute('data-lp');
  if (k === 't') { var x = taskBy(+tg.getAttribute('data-row')); if (x) lpShow(tv(x.type) + ' · ' + x.client, tMenu(x)); }
  else if (k === 'c') { var n = tg.getAttribute('data-n'); lpShow('🏢 ' + n, cMenu(n)); }
  else if (k === 'k') { var id = tg.getAttribute('data-k'), c = kById(id); if (c) lpShow('👷 ' + c.n, kMenu(c)); }
  else if (k === 'h') { var h = CUR && CUR.tasks[+tg.getAttribute('data-i')]; if (h) lpShow(tv(h.type) + ' · ' + CUR.name, tMenu(Object.assign({ client: CUR.name }, h))); }
}
function cMenu(n){
  var b = [[t('lpOpen'), function(){ openC(n); }], [t('lpTask'), function(){ openForm(n); }], [t('lpCand'), function(){ kForm({ emp: n }); }],
    [t('lpEdit'), function(){ whenCard(n, editC); }], [t('slBtn'), function(){ slShare(n); }]];
  if (canDel()) b.push([t('lpDel'), function(){ delClient(n); }, 'dg']);
  return b;
}
function whenCard(n, fn){ if (CUR && CUR.name === n && el('card').style.display === 'block') { fn(); return; } openC(n, fn); }
function kMenu(c){
  var ord = D.kst || [], i = ord.indexOf(c.st), nx = i > -1 && i + 1 < ord.length && !kOut(ord[i + 1]) ? ord[i + 1] : '';
  var b = [[t('lpOpen'), function(){ kOpen(c.id); }]];
  if (nx) b.push([t('lpNextSt', { s: tv(nx) }), function(){ kSt(nx, c.id); }]);
  b.push([t('lpEdit'), function(){ kForm(c); }]);
  if (c.ph) b.push([t('waBtn'), function(){ KC = c; waPick('k'); }]);
  if (canDel()) b.push([t('lpDel'), function(){ kDelQ(c.id); }, 'dg']);
  return b;
}
function tMenu(x){
  var pl = x.status === undefined || x.status === 'Планирана', b = [];
  if (pl && x.row) b.push([t('lpDone'), function(){ if (taskBy(x.row)) doneForm(x.row); else openC(x.client); }]);
  b.push([t('lpTEdit'), function(){ taskEdit(x); }]);
  if (pl) b.push([t('lpRep'), function(){ taskEdit(x, false, true); }]);
  if (x.status === 'Отменена') b.push([t('lpReopen'), function(){ taskEdit(x, true); }]);
  if (pl) b.push([t('lpCancel'), function(){ tCancel(x); }]);
  if (canDel()) b.push([t('lpTDel'), function(){ tDel(x); }, 'dg']);
  return b;
}
var TE = null;
function taskEdit(x, reopen, repOnly){
  TE = x; TE.reopen = !!reopen;
  var h = '<form id="frm" onsubmit="return sendTE(event)">';
  if (!repOnly) {
    h += fld(t('fType'), '<select name="type">' + opts(withCur(D.types, x.type), x.type) + '</select>');
    h += half(fld(t('fDate'), '<input type="date" name="date" required value="' + esc(x.date) + '">'), fld(t('fTime'), '<input type="time" name="time" value="' + esc(String(x.time || '').slice(0, 5)) + '">'));
    h += fld(t('fRemind'), '<input name="remind" class="remind" maxlength="80" value="' + esc(x.remind || '') + '">');
    h += fld(t('fDesc'), '<textarea name="desc" rows="3">' + esc(x.desc || '') + '</textarea>');
  }
  h += fld(t('fRep'), '<select name="rep">' + opts(withCur(D.reps, x.rep), x.rep || D.me) + '</select>');
  h += '<button class="save" id="sv">' + t('save') + '</button></form>';
  openSheet('✏️ ' + x.client + ' · ' + tv(x.type), h);
}
function tAfter(r, n, msg){ if (r && r.tasks) { ls('et_data', JSON.stringify(r)); render(r); } toast(msg); if (CUR && el('card').style.display === 'block' && CUR.name === n) refreshCard(); }
function sendTE(e){
  e.preventDefault(); var d = formData(), x = TE; d.row = x.row; d.client = x.client; if (x.reopen) d.reopen = true; svState(true);
  google.script.run.withSuccessHandler(function(r){ closeSheet(); tAfter(r, x.client, t('tSaved')); }).withFailureHandler(function(er){ svState(false); err(er); }).editTask(x.id || '', d);
  return false;
}
function tCancel(x){ if (!confirm(t('tCancelQ'))) return; google.script.run.withSuccessHandler(function(r){ tAfter(r, x.client, t('cancelled')); }).withFailureHandler(err).cancelTask(x.id || '', x.row, x.client); }
function tDel(x){ if (!confirm(t('tDelQ'))) return; google.script.run.withSuccessHandler(function(r){ tAfter(r, x.client, t('tDeleted')); }).withFailureHandler(err).deleteTask(x.id || '', x.row, x.client); }
function delClient(n){
  if (!confirm(t('cDelQ', { n: n }))) return;
  if (CUR && CUR.name === n) closeCard();
  D.clients = D.clients.filter(function(c){ return c.n !== n; }); D.tasks = D.tasks.filter(function(x){ return x.client !== n; }); render(D); toast(t('deleted') + n);
  google.script.run.withSuccessHandler(function(r){ if (r && r.tasks) { ls('et_data', JSON.stringify(r)); render(r); } }).withFailureHandler(function(e){ err(e); load(); }).deleteClient(n);
}

// ---------- ⚙️ Хора и достъп ----------
var ADMD = null;
function ago(ts){ var m = Math.round((Date.now() - ts) / 60000); if (m < 2) return t('now'); if (m < 60) return t('agoM', { n: m }); var hh = Math.round(m / 60); if (hh < 24) return t('agoH', { n: hh }); return t('agoD', { n: Math.round(hh / 24) }); }
function admOpen(){ openSheet(t('adm'), '<div class="load">' + t('loading') + '</div>'); api('admGet', []).then(function(r){ ADMD = r; admDraw(); }, function(e){ closeSheet(); err(e); }); }
function admTags(p){ return p.a ? t('admTagA') : [p.o ? t('admTagO') : t('admTagAll'), p.d ? t('admTagD') : ''].filter(Boolean).join(' · '); }
function admDraw(){
  openSheet(t('adm'), '<div style="padding:6px 16px 30px"><div class="s" style="margin:6px 0 10px">' + t('admHint') + '</div><div class="lst" style="margin:0">' + ADMD.people.map(function(p, i){
    return '<div class="ti"><div class="tr" onclick="admP(' + i + ')"><span class="tx"><b>' + esc(p.n) + (p.n === ADMD.me ? t('admYou') : '') + (p.b ? t('admBlocked') : '') + '</b><small>' + esc(admTags(p)) + '</small>' +
      '<small>' + (p.seen ? t('admSeen', { t: ago(p.seen) }) : t('admNever')) + ' · ' + (p.push ? t('admPush', { n: p.push }) : t('admNoPush')) + '</small></span><span class="ar">›</span></div></div>';
  }).join('') + '</div><button class="save" onclick="admP(-1)">' + t('admAdd') + '</button></div>');
}
function admSwH(p, k, dis){ return '<label class="sw"><input type="checkbox" id="as_' + k + '"' + (p[k] ? ' checked' : '') + (dis ? ' disabled' : '') + ' onchange="admSw()"><span><b>' + t('adm' + k.toUpperCase()) + '</b><small>' + t('adm' + k.toUpperCase() + 'B') + '</small></span></label>'; }
function admP(i){
  var p = i < 0 ? { n: '', a: false, o: false, d: false, mail: '' } : ADMD.people[i], me = p.n === ADMD.me;
  var h = '<form id="frm" onsubmit="return admSend(event,' + i + ')">';
  if (i < 0) h += fld(t('admName'), '<input name="n" required maxlength="30" autocomplete="off">');
  h += '<div class="sws">' + admSwH(p, 'a', me) + '<div id="admX">' + admSwH(p, 'o') + admSwH(p, 'd') + '</div></div>';
  h += fld(t('admMail'), '<input name="mail" type="email" autocomplete="off" value="' + esc(p.mail || '') + '">');
  h += '<button class="save" id="sv">' + (i < 0 ? t('admSaveNew') : t('save')) + '</button></form>';
  if (i >= 0) h += '<div class="acts" style="padding:0 16px 34px;margin-top:-24px">' + (p.b ? '<button class="ok" onclick="admDo(\'admPin\',' + i + ')">' + t('admUnblock') + '</button>'
    : '<button onclick="admShowPin(' + i + ')">' + t('admShow') + '</button><button onclick="admDo(\'admPin\',' + i + ')">' + t('admNewPin') + '</button>' + (me ? '' : '<button onclick="admDo(\'admBlock\',' + i + ')">' + t('admBlock') + '</button>')) +
    (me ? '' : '<button style="color:#b91c1c" onclick="admDo(\'admRemove\',' + i + ')">' + t('admRemove') + '</button>') + '</div>';
  openSheet(i < 0 ? t('admAdd') : '👤 ' + p.n, h); admSw();
}
function admSw(){ var a = el('as_a'), x = el('admX'); if (!a || !x) return; x.style.opacity = a.checked ? .4 : 1; x.style.pointerEvents = a.checked ? 'none' : 'auto'; }
function admVal(k){ var e = el('as_' + k); return !!(e && e.checked); }
function admSend(e, i){
  e.preventDefault(); var d = formData(), p = { a: admVal('a'), o: admVal('o'), d: admVal('d'), mail: d.mail || '' };
  if (i >= 0 && ADMD.people[i].n === ADMD.me) p.a = true;
  svState(true);
  api(i < 0 ? 'admAdd' : 'admSave', i < 0 ? [d.n, p] : [ADMD.people[i].n, p]).then(function(r){ ADMD = r; if (r.pin) admPinShow(r.who, r.pin, true); else { toast(t('rec')); admDraw(); } }, function(er){ svState(false); err(er); });
  return false;
}
function admDo(fn, i){
  var p = ADMD.people[i], q = fn === 'admPin' ? t('admQPin', { n: p.n }) : fn === 'admBlock' ? t('admQBlock', { n: p.n }) : t('admQRemove', { n: p.n });
  if (!confirm(q)) return;
  api(fn, [p.n]).then(function(r){ ADMD = r; if (r.pin) admPinShow(r.who, r.pin); else { toast(t('rec')); admDraw(); } }, err);
}
function admShowPin(i){ api('admShow', [ADMD.people[i].n]).then(function(r){ admPinShow(r.who, r.pin); }, err); }
var PINTXT = '';
function admPinShow(who, pin, isNew){
  PINTXT = 'Employeetrade CRM: ' + location.origin + location.pathname + '\nPIN: ' + pin;
  openSheet(t('admPinFor', { n: who }), '<div style="padding:20px 16px 30px;text-align:center">' + (isNew ? '<div class="s" style="font-size:15px">' + esc(t('admAdded', { n: who })) + '</div>' : '') +
    '<div class="pinbig">' + esc(pin || '—') + '</div><div class="s" style="font-size:14px">' + esc(t('admPinTxt', { n: who })) + '</div>' +
    (pin ? '<button class="save" onclick="admShare()">' + t('admShare') + '</button>' : '') + '<button class="save" style="background:#64748b" onclick="admDraw()">' + t('admBack') + '</button></div>');
}
function admShare(){ if (navigator.share) { navigator.share({ text: PINTXT }).catch(function(){}); return; } try { navigator.clipboard.writeText(PINTXT).then(function(){ toast(t('slCopied')); }); } catch (e) { prompt('', PINTXT); } }

// ---------- 🔔 Известия ----------
function idb(fn){
  try { var q = indexedDB.open('crm', 1); q.onupgradeneeded = function(){ q.result.createObjectStore('kv'); };
    q.onsuccess = function(){ var st = null; try { st = q.result.transaction('kv', 'readwrite').objectStore('kv'); } catch (e) {} fn(st); };
    q.onerror = function(){ fn(null); }; } catch (e) { fn(null); }
}
function keepTok(tk){ idb(function(st){ try { if (st) { if (tk) st.put(tk, 'token'); else st.delete('token'); } } catch (e) {} }); }
function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function standalone(){ return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
function u8(b){ var s = atob(String(b).replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((String(b).length + 3) % 4)), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
function pushState(cb){
  if (isIOS() && !standalone()) return cb('ios');
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return cb('no');
  if (Notification.permission === 'denied') return cb('denied');
  navigator.serviceWorker.ready.then(function(r){ return r.pushManager.getSubscription(); }).then(function(s){ cb(s ? 'on' : 'off'); }, function(){ cb('no'); });
}
function pushOn(){
  if (!D || !D.pk) { toast(t('wait')); return; }
  pushState(function(st){
    if (st === 'ios') { alert(t('pushIos')); return; }
    if (st === 'no') { alert(t('pushNoSup')); return; }
    if (st === 'denied') { alert(t('pushDenied')); return; }
    Notification.requestPermission().then(function(p){
      if (p !== 'granted') { toast(t('pushDenied'), 5000); return; }
      keepTok(TOKEN);
      navigator.serviceWorker.ready.then(function(r){
        return r.pushManager.getSubscription().then(function(s){ return s ? s.unsubscribe() : null; }).then(function(){ return r.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: u8(D.pk) }); });
      }).then(function(s){ return api('pushSub', [s.endpoint]); }).then(function(){ toast(t('pushDone'), 4000); pushAskDraw(); api('pushTest', []).catch(function(){}); }, function(e){ toast('⚠️ ' + (e && e.message || e), 6000); });
    });
  });
}
function pushOff(){
  navigator.serviceWorker.ready.then(function(r){ return r.pushManager.getSubscription(); }).then(function(s){ if (!s) return; var ep = s.endpoint; return s.unsubscribe().then(function(){ return api('pushUnsub', [ep]); }); })
    .then(function(){ toast(t('pushOffDone')); }, err);
}
function pushBtn(){ pushState(function(st){ var b = el('pushB'); if (!b) return; b.textContent = st === 'on' ? t('pushOff') : t('pushOn'); b.onclick = st === 'on' ? function(){ closeSheet(); pushOff(); } : function(){ closeSheet(); pushOn(); }; }); }
function pushAskDraw(){
  var e = el('pushAsk'); if (!e) return;
  if (ls('et_pushno') === '1' || !D || !D.pk) { e.innerHTML = ''; return; }
  pushState(function(st){
    var e2 = el('pushAsk'); if (!e2) return;
    if (st !== 'off' && st !== 'ios') { e2.innerHTML = ''; return; }
    e2.innerHTML = '<div class="pask"><b>' + t('pushAskT') + '</b><span>' + t('pushAskB') + '</span><div class="acts"><button class="ok" onclick="pushOn()">' + t('pushYes') + '</button><button onclick="ls(\'et_pushno\',\'1\');pushAskDraw()">' + t('pushNo') + '</button></div></div>';
  });
}
var PENDOPEN = null;
try { (function(){ var q = new URLSearchParams(location.search), c = q.get('c'), k = q.get('k'); if (c || k) { PENDOPEN = { c: c || '', k: k || '' }; history.replaceState(null, '', location.pathname); } })(); } catch (e) {}
function pendOpen(){
  if (!PENDOPEN || !D) return; var p = PENDOPEN; PENDOPEN = null;
  setTimeout(function(){ if (p.k && kById(p.k)) kOpen(p.k); else if (p.c && dcOf(p.c)) openC(dcOf(p.c).n); }, 80);
}
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', function(e){ var m = e.data && e.data.crmOpen; if (!m) return; PENDOPEN = { c: m.c || '', k: m.k || '' }; load(); });

document.addEventListener('visibilitychange', function(){ if (!document.hidden && D && TOKEN && el('sheet').style.display !== 'block' && el('prog').style.display !== 'block') load(); });
// Нова версия → проверява се при всяко отваряне/връщане в приложението и се зарежда сама
if ('serviceWorker' in navigator) {
  var swHad = !!navigator.serviceWorker.controller, swDone = false;
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function(r){
    document.addEventListener('visibilitychange', function(){ if (!document.hidden) r.update().catch(function(){}); });
    setInterval(function(){ r.update().catch(function(){}); }, 1800000);
  }).catch(function(){});
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if (!swHad) { swHad = true; return; }
    if (swDone) return; swDone = true;
    if (el('sheet').style.display === 'block' || el('prog').style.display === 'block') { toast(t('newVerL'), 5000); return; }
    toast(t('newVer'), 3000); setTimeout(function(){ location.reload(); }, 400);
  });
}
boot();
